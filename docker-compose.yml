services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    environment:
      CET_DB_PATH: ${CET_DB_PATH:-/app/data/cet_agent.db}
      CET_ADMIN_USERNAMES: ${CET_ADMIN_USERNAMES:-}
      CET_MINERU_API_KEY: ${CET_MINERU_API_KEY:-}
      CET_MINERU_BASE_URL: ${CET_MINERU_BASE_URL:-https://mineru.net/api/v4}
      CET_MODEL_BASE_URL: ${CET_MODEL_BASE_URL:-https://api.openai.com/v1}
      CET_MODEL_API_KEY: ${CET_MODEL_API_KEY:?CET_MODEL_API_KEY is required in .env}
      CET_MODEL_NAME: ${CET_MODEL_NAME:-gpt-4o-mini}
      CET_SESSION_SECRET_KEY: ${CET_SESSION_SECRET_KEY:?CET_SESSION_SECRET_KEY is required in .env}
      CET_COOKIE_SECURE: ${CET_COOKIE_SECURE:-false}
      CET_AUTH_SESSION_CLEANUP_PROBABILITY: ${CET_AUTH_SESSION_CLEANUP_PROBABILITY:-0.01}
      CET_CORS_ALLOWED_ORIGINS: ${CET_CORS_ALLOWED_ORIGINS:-http://localhost:8080}
    volumes:
      - backend_data:/app/data
      - backend_uploads:/app/uploads
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${APP_PORT:-8080}:80"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  backend_data:
  backend_uploads:
